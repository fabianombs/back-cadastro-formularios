# =============================================================================
# Promtail — versao de SERVIDOR (EC2). FABIANO-23
# =============================================================================
# Em dev a aplicacao escreve ./logs/app.json e o Promtail le o arquivo. Aqui a
# aplicacao roda em container e escreve em stdout: quem guarda e o driver
# json-file do Docker. Por isso a descoberta e pelo socket do Docker, e nao por
# caminho fixo — assim um container recriado pelo deploy continua sendo lido
# sem ninguem mexer em configuracao.
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers-fabiano
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        # FABIANO-69. Filtro na ORIGEM, pedindo ao Docker so estes containers.
        #
        # O 'action: keep' do relabel abaixo tinha a mesma intencao e nao bastou:
        # com os 8 containers descobertos, ALGUM deles produzia fluxo sem rotulo
        # nenhum, e o Loki recusa o LOTE INTEIRO com 400 quando um unico fluxo
        # vem vazio — levando junto as linhas boas do backend.
        #
        # Resultado medido em 08/08/2026: com 8 alvos, promtail_sent_entries_total
        # ficou em 0 e 32.258 linhas foram descartadas. Com o filtro, 2/2 alvos e
        # a entrega voltou.
        filters:
          - name: name
            values: ["fabiano-backend", "fabiano-nginx"]

    relabel_configs:
      # So os containers da stack. Sem este filtro, Loki, Grafana e Prometheus
      # entrariam tambem — e o log do Promtail sobre o Loki indo para o Loki e
      # um jeito conhecido de encher disco.
      #
      # ATENCAO (FABIANO-69): este 'keep' NAO estava bastando. Em 08/08/2026 a
      # pagina /targets mostrava "8/8 ready" com ele presente e carregado.
      # O filtro que de fato restringe e o 'filters' do docker_sd_configs acima.
      # Este bloco fica porque as regras seguintes (container, application)
      # dependem dele e funcionam — mas nao confie nele como unica barreira.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(fabiano-backend|fabiano-nginx)'
        action: keep

      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # 'application' precisa ser exatamente fabiano-back: e o rotulo que a
      # regra de alerta "Erros aparecendo no log" consulta (rules.yaml:383).
      - source_labels: ['__meta_docker_container_name']
        regex: '/fabiano-backend'
        target_label: 'application'
        replacement: 'fabiano-back'

      # 'prod' desde 08/08/2026: esta maquina assumiu o Elastic IP de producao
      # (FABIANO-47). Ficou 'homolog' por algumas horas depois da virada, e um
      # rotulo mentindo e pior que rotulo faltando — a consulta acha, so que a
      # resposta esta errada.
      #
      # Quando a homolog sob demanda nascer (FABIANO-33), este valor precisa
      # virar variavel: promtail aceita ${VAR} com -config.expand-env=true. NAO
      # foi feito agora de proposito: sem a variavel definida o rotulo vira
      # vazio, e fluxo sem par de rotulo faz o Loki recusar o lote inteiro com
      # 400 — exatamente a falha do FABIANO-69.
      - target_label: 'ambiente'
        replacement: 'prod'

    pipeline_stages:
      # FABIANO-69. Rede de seguranca: carimba um rotulo em TODA linha, sem
      # depender de nenhuma regra de relabel dar certo.
      #
      # Fluxo sem nenhum par de rotulo faz o Loki devolver 400 e descartar o
      # lote inteiro. E a falha mais cara possivel: silenciosa, total, e com
      # o painel mostrando zero em verde.
      #
      # Sozinho, este estagio ja tirou a entrega de 0 para 95 linhas em 60s.
      - static_labels:
          ambiente: prod

      # NAO usar o estagio 'docker' aqui (FABIANO-62).
      #
      # Ele existe para desembrulhar o formato do driver json-file
      # ({"log":"...","stream":...}), lido por CAMINHO DE ARQUIVO. Mas a
      # descoberta acima e docker_sd_configs, que entrega a linha JA
      # desembrulhada pela API do Docker.
      #
      # Aplicado numa linha limpa, ele procurava um campo 'log' e usava como
      # conteudo. O JSON da aplicacao TEM um campo 'log' — e um objeto:
      # "log":{"level":"WARN","logger":"..."}. A linha inteira virava esse
      # objeto, e mensagem, requestId, rota, status e duracao eram descartados.
      # Os estagios seguintes procuravam 'log.level' num conteudo que ja nao
      # tinha mais 'log', entao os rotulos nivel e logger nunca eram criados —
      # e o alerta "Erros aparecendo no log", que consulta nivel="ERROR",
      # nunca poderia disparar.
      #
      # - docker: {}

      # Linha que nao e JSON (nginx, banner do Spring) passa direto. Sem este
      # desvio, o estagio json abaixo derruba a linha inteira em silencio.
      - match:
          selector: '{application="fabiano-back"}'
          stages:
            - json:
                expressions:
                  nivel: 'log.level'
                  logger: 'log.logger'
                  mensagem: message
                  momento: '"@timestamp"'
                  requestId: requestId
                  userId: userId
                  metodo: method
                  rota: path
                  status: status
                  duracaoMs: duracaoMs

            - timestamp:
                source: momento
                format: RFC3339Nano
                # Linha sem carimbo valido usa a hora da coleta em vez de ser
                # descartada. Perder o log do boot por causa do banner seria
                # perder justamente o que se olha quando algo nao subiu.
                action_on_failure: fudge

            - labels:
                nivel:
                logger:

            # Alta cardinalidade vai como metadado, nunca como rotulo: cada
            # valor distinto de rotulo cria um fluxo proprio no Loki, e um
            # requestId por requisicao criaria um fluxo por requisicao.
            - structured_metadata:
                requestId:
                userId:
                metodo:
                rota:
                status:
                duracaoMs:

            - output:
                source: mensagem
