# =============================================================================
# nginx de producao — dentro do container (FABIANO-15)
#
# Montado em /etc/nginx/conf.d/default.conf.
# Portado do /etc/nginx/conf.d/poc-fabiano.conf que rodava no host da EC2.
#
# Diferencas em relacao ao host, todas deliberadas:
#   - proxy_pass aponta para 'backend:8080', o nome do servico no compose, e
#     nao para localhost:8080
#   - client_max_body_size aparece (FABIANO-40 — nao existia, e o padrao de
#     1 MB estava recusando upload de foto antes de chegar na aplicacao)
#   - /actuator deixa de ser alcancavel da internet, exceto /health
# =============================================================================

upstream backend {
    # 'backend' e o nome do servico no docker-compose.yml. O DNS interno do
    # Docker resolve isso para o IP do container, que muda a cada recriacao —
    # por isso nao da para fixar IP aqui.
    server backend:8080;
}

server {
    listen 80;
    # Os tres nomes que esta maquina atende hoje. Antes so o de producao estava
    # aqui e os demais chegavam pelo default_server implicito (o primeiro bloco
    # da porta) — funcionava por acidente. Explicito porque o desafio HTTP-01 da
    # renovacao depende deste bloco: nome fora da lista, renovacao falha.
    server_name 100-30-35-83.sslip.io api-hml.nexventa.com.br grafana-hml.nexventa.com.br;

    # Alvo do healthcheck do CONTAINER. Precisa vir antes do redirect e
    # devolver 200 sem redirecionar.
    #
    # A versao anterior apontava para 'http://localhost/', que cai no 301 abaixo.
    # O wget do BusyBox segue o redirect ate https://localhost/, onde o
    # certificado (emitido para o dominio real) nao casa — e o container ficava
    # unhealthy PARA SEMPRE com o nginx funcionando perfeitamente. Descoberto
    # rodando de verdade no FABIANO-15.
    #
    # Testa o nginx, nao o backend: o backend tem healthcheck proprio, e
    # misturar os dois faz o nginx ser declarado doente por problema alheio.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # O desafio HTTP-01 da Let's Encrypt precisa ser servido em HTTP puro,
    # ANTES do redirect para HTTPS. O '^~' impede que qualquer location por
    # regex assuma na frente desta.
    #
    # O diretorio e o mesmo caminho absoluto do host (/var/www/certbot), de
    # proposito: o certbot continua rodando no host e escrevendo la, e o
    # container so le. Assim a migracao para container nao exigiu tocar em
    # nenhuma configuracao do certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 100-30-35-83.sslip.io;

    # Os tres caminhos abaixo vivem dentro de /etc/letsencrypt, montado
    # read-only no container. O options-ssl-nginx.conf e o ssl-dhparams.pem sao
    # gerados pelo certbot e vem junto na mesma montagem — nao precisam ser
    # versionados aqui, e versiona-los criaria duas fontes da mesma verdade.
    ssl_certificate     /etc/letsencrypt/live/100-30-35-83.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/100-30-35-83.sslip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # As rotas vivem em arquivo separado porque sao servidas por DOIS blocos
    # (producao e ensaio). Ver nginx/app-locations.conf.
    include /etc/nginx/app-locations.conf;
}

# =============================================================================
# HOMOLOGACAO — NOME DEFINITIVO (FABIANO-51)
# =============================================================================
# api-hml.nexventa.com.br e um registro A na zona nexventa.com.br, gerenciada na
# Vercel. Diferente dos nomes sslip.io acima, este NAO deriva do IP: quando o
# homolog for recriado com outro IP (FABIANO-33), muda so o registro A — nome,
# certificado e configuracao do frontend continuam valendo.
#
# Este bloco SOBREVIVE a virada (FABIANO-47). Os dois blocos sslip.io nao.
# =============================================================================
server {
    listen 443 ssl;
    server_name api-hml.nexventa.com.br;

    ssl_certificate     /etc/letsencrypt/live/api-hml.nexventa.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-hml.nexventa.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/app-locations.conf;
}

# =============================================================================
# GRAFANA — PAINEL DE OBSERVABILIDADE (FABIANO-23 / 27 / 28)
# =============================================================================
# O Grafana nao publica porta no host: so existe dentro da rede fabiano-internal.
# Este bloco e a UNICA porta de entrada, e ela termina TLS. Assim o painel nunca
# fica acessivel em HTTP puro pelo IP da EC2.
#
# O nome e grafana-hml enquanto esta maquina e homologacao. Na virada
# (FABIANO-47), quando ela assumir o Elastic IP, nasce grafana.nexventa.com.br
# apontando para o IP de producao e este nome acompanha o homolog recriado.
# =============================================================================
server {
    listen 443 ssl;
    server_name grafana-hml.nexventa.com.br;

    ssl_certificate     /etc/letsencrypt/live/grafana-hml.nexventa.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana-hml.nexventa.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://grafana:3000;
        include    /etc/nginx/proxy-common.conf;

        # Grafana Live usa WebSocket. Sem estes dois cabecalhos o painel abre,
        # mas os graficos param de atualizar sozinhos e o console do navegador
        # enche de erro de conexao — sintoma que nao aparece em nenhum log do
        # servidor.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Consulta longa em painel de log estoura o padrao de 60s.
        proxy_read_timeout 300s;
    }
}
