# Cabecalhos repassados ao backend. Vive num arquivo separado porque sao usados
# em mais de um 'location', e duplicar convida a alterar um e esquecer o outro.
#
# X-Forwarded-Proto e o mais importante: sem ele o Spring acha que a requisicao
# chegou em HTTP puro e monta URLs absolutas com http://, que o navegador recusa
# como conteudo misto numa pagina servida por HTTPS.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
