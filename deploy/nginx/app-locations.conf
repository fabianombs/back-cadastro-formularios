# =============================================================================
# Rotas da aplicacao — compartilhadas por todos os blocos HTTPS
# =============================================================================
# Fora do conf.d de proposito: o nginx carrega todo *.conf de la como bloco de
# servidor, e este arquivo contem apenas diretivas de contexto 'server'.
#
# Existe porque a maquina atende por DOIS nomes durante a migracao (o de
# producao e o de ensaio), cada um com seu certificado, e certificado diferente
# exige bloco 'server' separado. Duplicar as rotas nos dois blocos criaria a
# situacao classica: alguem corrige uma e esquece a outra, e o ambiente de teste
# deixa de testar o que roda de verdade.
# =============================================================================

# FABIANO-40. O padrao do nginx e 1 MB; o Spring aceita ate 5 MB
# (spring.servlet.multipart.max-file-size). Sem esta linha, arquivo entre
# 1 e 5 MB morria com 413 no nginx, sem chegar na aplicacao e sem aparecer
# em nenhum log ou metrica dela.
#
# 10M e nao 6M: o multipart do Spring conta so o arquivo, o nginx conta o
# envelope inteiro. A folga garante que quem recusa arquivo grande demais
# seja o Spring, com a mensagem que o frontend sabe tratar.
client_max_body_size 10M;

# /actuator/health fica publico porque JA e publico hoje, e nao vaza nada:
# application-prod.properties define management.endpoint.health.show-details
# =never, entao a resposta e so {"status":"UP"}. Fechar seria mudanca de
# comportamento capaz de derrubar em silencio algum monitor externo que a
# gente nao sabe que existe.
location = /actuator/health {
    proxy_pass http://backend;
    include /etc/nginx/proxy-common.conf;
}

# O resto do actuator nao tem motivo para ser alcancavel da internet. O
# Spring Security ja exige autenticacao neles, isto e uma camada a menos de
# superficie exposta. O Prometheus raspa /actuator/prometheus pela rede
# interna do compose, sem passar por aqui.
#
# 404 e nao 403: 403 confirma que o caminho existe.
location /actuator/ {
    return 404;
}

location / {
    proxy_pass http://backend;
    include /etc/nginx/proxy-common.conf;
}
