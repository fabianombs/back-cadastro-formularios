# ===============================
# SERVER
# ===============================
# Railway injeta PORT automaticamente
server.port=${PORT:8080}

# ===============================
# DATABASE
# ===============================
# sslMode=REQUIRED obriga TLS entre a EC2 e o RDS: se o driver nao conseguir
# criptografar, ele recusa a conexao em vez de cair para texto puro.
# allowPublicKeyRetrieval foi removido de proposito - ele so e necessario em
# conexao sem TLS e, nesse caso, permite que um intermediario entregue a
# propria chave publica e leia a senha em texto puro (relevante a partir do
# caching_sha2_password).
# connectTimeout e socketTimeout NAO sao detalhe de ajuste fino: sem eles o
# Connector/J usa socketTimeout=0, ou seja, leitura SEM PRAZO. Quando o banco
# some, a primeira requisicao pega do pool uma conexao que parece boa, escreve
# nela e espera para sempre — ate o nginx desistir aos 60s e devolver 504.
# O hikari.connection-timeout acima nao cobre esse caso: ele limita a espera
# POR uma conexao do pool, nao a leitura numa conexao ja entregue.
# Medido em homologacao, 10/08/2026, DUAS vezes:
#   sem socketTimeout ....... 504 aos 60s (o nginx desiste; a aplicacao nao)
#   socketTimeout=15000 ..... 503 aos 30,07s
#   socketTimeout=5000 ...... 503 aos 10,09s
# A resposta e sempre 2 x socketTimeout: a requisicao consome DUAS conexoes
# mortas em sequencia, e o hikari.connection-timeout e conferido entre
# tentativas, nao durante uma leitura bloqueada.
#
# 5000 escolhido pela latencia REAL, nao por estimativa. A rota mais lenta
# que a producao ja atendeu em 7 dias e o GET /dashboard, com 0,700s de pior
# caso e 0,160s de media, em 3726 requisicoes. 5s e 7x a pior rota — folga
# suficiente para nao transformar consulta legitima em 503 (FABIANO-80).
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=5000&socketTimeout=5000
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# validate = Flyway gerencia o schema, Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# ACTUATOR
# ===============================
# Herda a lista do application.properties (health,info,prometheus,metrics).
# show-details=never de proposito: /actuator/health e publico, e detalhe de
# banco e disco em resposta publica e entrega de mapa da infraestrutura.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never

# ===============================
# LOGS
# ===============================
# JSON no formato Elastic Common Schema. Nativo desde o Boot 3.4, sem
# dependencia extra. O conteudo do MDC entra automaticamente, e a excecao vai
# inteira no campo error.stack_trace em vez de picotada em varias linhas -
# metade da razao de usar JSON.
logging.structured.format.console=ecs

# root=WARN e conservador demais agora que existe Loki: evento de negocio
# relevante nao chegava a ser escrito.
logging.level.root=WARN
logging.level.com.cadastro.fabiano=INFO
logging.level.org.springframework.security=WARN

# ===============================
# UPLOAD / IMAGE STORAGE (S3)
# ===============================
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.base-url=${AWS_S3_BASE_URL}

# ===============================
# FRONTEND URL (para gerar links publicos de survey/quiz)
# ===============================
app.frontend-url=https://nexventa.com.br