# =============================================================================
# Perfil homolog (FABIANO-66)
# =============================================================================
# ATENCAO — leia antes de mexer: perfil do Spring NAO herda de perfil.
# Este arquivo NAO e um "delta do prod". O Spring carrega application.properties
# (base) e depois SOMENTE o application-<perfil> ativo. Tudo que estiver so no
# application-prod.properties simplesmente nao existe aqui.
#
# Foi assim que este arquivo nasceu quebrado: tinha 6 linhas, usava um ${DB_URL}
# que nao existe em lugar nenhum, e teria derrubado homologacao no primeiro
# deploy em que o perfil fosse ligado de verdade.
#
# REGRA: qualquer linha nova em application-prod.properties precisa ser
# replicada aqui, a menos que a diferenca seja intencional e esteja comentada.
# As diferencas intencionais de hoje estao marcadas com [DIFERE DO PROD].
# =============================================================================

# ===============================
# SERVER
# ===============================
# 8080, igual ao prod, e NAO 8081. O nginx faz proxy_pass para backend:8080 e o
# Prometheus raspa backend:8080 — porta divergente derruba homologacao inteira.
# Manter as duas maquinas simetricas e mais simples que ensinar nginx e
# Prometheus a mudar de porta por ambiente.
server.port=${PORT:8080}

# ===============================
# DATABASE
# ===============================
# Montada a partir de DB_HOST/DB_PORT/DB_NAME, igual ao prod. A versao antiga
# usava ${DB_URL}, variavel que nao existe no .env, no compose nem no
# user_data.sh — a aplicacao nem subia.
#
# sslMode=REQUIRED obriga TLS entre a EC2 e o RDS: se o driver nao conseguir
# criptografar, ele recusa a conexao em vez de cair para texto puro.
# connectTimeout e socketTimeout NAO sao detalhe de ajuste fino: sem eles o
# Connector/J usa socketTimeout=0, ou seja, leitura SEM PRAZO. Quando o banco
# some, a primeira requisicao pega do pool uma conexao que parece boa, escreve
# nela e espera para sempre — ate o nginx desistir aos 60s e devolver 504.
# O hikari.connection-timeout acima nao cobre esse caso: ele limita a espera
# POR uma conexao do pool, nao a leitura numa conexao ja entregue.
# Medido em homologacao, 10/08/2026: sem estes parametros a 1a requisicao
# depois da queda tomou 504 aos 60s; com eles, 503 com Retry-After aos 30s.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=5000&socketTimeout=15000
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# validate = Flyway gerencia o schema, Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# [DIFERE DO PROD] — e a unica diferenca de comportamento de verdade.
# O base define true e producao herda. Homologacao roda com false para ensaiar
# a mudanca do FABIANO-37: a falha de open-in-view=false aparece em tempo de
# execucao, na resposta ao usuario, e nao no build. E exatamente para isso que
# homologacao existe.
spring.jpa.open-in-view=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# ACTUATOR
# ===============================
# show-details=never de proposito: /actuator/health e publico, e detalhe de
# banco e disco em resposta publica e entrega de mapa da infraestrutura.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never

# ===============================
# LOGS
# ===============================
# NAO REMOVER. Sem esta linha o log deixa de ser JSON no formato ECS, o
# Promtail entrega linha que o Loki nao sabe ler, e a tela de Logs fica vazia
# parecendo calmaria — que foi o FABIANO-62. Homologacao precisa disto tanto
# quanto producao: e nela que a gente descobre que o log quebrou.
logging.structured.format.console=ecs

logging.level.root=WARN
logging.level.com.cadastro.fabiano=INFO
logging.level.org.springframework.security=WARN

# ===============================
# UPLOAD / IMAGE STORAGE (S3)
# ===============================
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.base-url=${AWS_S3_BASE_URL}

# ===============================
# FRONTEND URL
# ===============================
# [DIFERE DO PROD] — producao fixa https://nexventa.com.br no proprio arquivo.
# Aqui NAO se fixa: o valor vem de APP_FRONTEND_URL, definido no .env da
# maquina. Fixar a URL de producao aqui faria os links publicos de quiz,
# ranking e survey gerados em homologacao apontarem para producao (FABIANO-52).
# O padrao de localhost:4200 vem do application.properties base.
