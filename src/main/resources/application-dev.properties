# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================
# DATASOURCE
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}/${DB_NAME:teste_fabiano_cadastro2}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===============================
# OBSERVABILIDADE (dev only)
# ===============================
# Mesmo valor que esta no observability/prometheus/prometheus.yml, para a stack
# local subir funcionando sem configuracao manual. Em producao vem por variavel.
metrics.scrape-token=${METRICS_SCRAPE_TOKEN:token-local-de-desenvolvimento-nao-use-em-producao}

# O console continua legivel para humano; o ARQUIVO sai em JSON para o Promtail
# ler. Assim da para desenvolver lendo o log normal e ainda alimentar o Loki.
logging.structured.format.file=ecs
logging.file.name=logs/app.json

# ===============================
# JWT (dev only)
# ===============================
# Padrao existe apenas aqui. O application.properties nao tem, entao os perfis
# prod e homolog exigem a variavel de ambiente. Minimo de 32 caracteres: o HS256
# do jjwt recusa chave menor que 256 bits.
jwt.secret=${JWT_SECRET:chave-local-de-desenvolvimento-nao-use-em-producao}

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY (dev only)
# ===============================
# Limpa automaticamente entradas com falha do histórico antes de migrar.
# Necessário quando uma migration falhou a meio-caminho (ex: SQL inválido).
spring.flyway.repair-on-migrate=true