spring.application.name=cadastroFabiano

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===============================
# BANCO DE DADOS - RESILIENCIA
# ===============================
# A aplicacao precisa desistir da conexao ANTES do nginx desistir dela.
# Com o padrao do Hikari (30s) e o padrao do nginx (60s), uma requisicao que
# pede conexao duas vezes - o filtro de autenticacao consulta o usuario, o
# servico consulta de novo - estoura o proxy. O cliente recebe um 504 do nginx
# em vez do 503 da aplicacao: sem Retry-After, sem passar pelo
# GlobalExceptionHandler, sem incrementar metrica e sem gerar log. Ou seja,
# invisivel para o monitoramento justo no instante da queda (FABIANO-61).
#
# 5s e folgado para um pool saudavel: conexao ociosa e entregue em
# microssegundos, e este tempo so entra em cena quando ja ha problema.
spring.datasource.hikari.connection-timeout=5000

# Nao trava a subida se o banco estiver fora no momento do boot. A aplicacao
# sobe, responde 503 nas rotas que dependem do banco, e se recupera sozinha
# quando ele voltar - em vez de morrer e deixar o container reiniciando em
# loop, que e pior de diagnosticar e apaga o proprio log.
spring.datasource.hikari.initialization-fail-timeout=-1

# ===============================
# JWT
# ===============================
# SEM valor padrao, de proposito. Se JWT_SECRET nao estiver definido a
# aplicacao se recusa a subir com "Could not resolve placeholder 'JWT_SECRET'".
# Com um padrao aqui, um env file recriado sem a variavel faria a aplicacao
# subir normalmente assinando token com a chave que esta no repositorio -
# sem erro no log e sem sintoma. Falhar barulhento e melhor que rodar inseguro.
# O perfil dev define o proprio padrao, para nao atrapalhar o desenvolvimento.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# CORS
# ===============================
# Origens permitidas para o painel administrativo.
# Em producao, defina com a URL exata do frontend (ex: https://meusite.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}


# ===============================
# UPLOAD DE IMAGENS
# ===============================
# Diretorio onde os arquivos serao salvos (relativo ao diretorio de execucao)
app.upload-dir=${UPLOAD_DIR:uploads}
# URL base da API (usada para gerar o link publico da imagem)
app.base-url=${APP_BASE_URL:http://localhost:8080}
# URL do frontend — usada para gerar links públicos do quiz (quiz e ranking)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}


# ===============================
# OBSERVABILIDADE (Micrometer / Prometheus)
# ===============================
# health continua publico (o health-gate do deploy-safe.sh depende dele);
# prometheus e metrics exigem autenticacao pelo SecurityConfig.
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Histograma de latencia: sem isto o Prometheus recebe so contagem e soma, e
# nao da para calcular p95/p99 no Grafana. Os SLOs viram os limites dos buckets.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,300ms,500ms,1s,3s

# Token que o Prometheus apresenta para ler /actuator/prometheus. Vazio por
# padrao: sem a variavel definida, o endpoint continua exigindo autenticacao
# normal e nenhum coletor entra. Ver SecurityConfig.coletorAutorizado.
metrics.scrape-token=${METRICS_SCRAPE_TOKEN:}

# Registra os MBeans do Tomcat. Sem esta linha o Micrometer nao publica
# tomcat_threads_* e o painel de saturacao do pool nasce sem dado - o pool
# de threads cheio e justamente o que trava a aplicacao na t2.micro antes de
# qualquer erro aparecer no log.
server.tomcat.mbeanregistry.enabled=true

# ===============================
# RUIDO DE LOG (FABIANO-25)
# ===============================
# Valor BASE, herdado por producao. Continua true de proposito (FABIANO-37).
#
# Os perfis dev e homolog ja sobrescrevem para false e e la que a mudanca esta
# sendo exercitada. Producao so vira quando o ensaio em homologacao tiver
# passado por todas as rotas de leitura com dados reais - a falha de
# open-in-view=false aparece em tempo de execucao, na resposta ao usuario, e nao
# no build. Trocar aqui antes disso seria descobrir o problema em producao.
spring.jpa.open-in-view=true

# ===============================
# N+1 / BATCH FETCH (FABIANO-38)
# ===============================
# Sem isto, cada relacao LAZY de cada item de uma pagina vira uma consulta
# separada: uma listagem de 20 templates carregava fields, options de cada
# field, dedupFields, quiz e survey um a um - mais de 150 idas ao banco para
# montar uma tela. Com batch fetch o Hibernate agrupa os ids pendentes num
# unico IN (...).
#
# E propriedade global, e nao @EntityGraph/JOIN FETCH nos repositorios, por
# dois motivos: JOIN FETCH de colecao junto com Pageable faz o Hibernate
# paginar em memoria (HHH000104), e FormTemplate tem duas colecoes - buscar
# as duas no mesmo JOIN FETCH da MultipleBagFetchException. Batch fetch nao
# muda a forma de nenhuma consulta existente, so a quantidade de viagens.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# O aviso de serializacao de PageImpl foi RESOLVIDO na origem (FABIANO-36): os
# controllers devolvem PaginaResponse e nenhum PageImpl chega ao Jackson. A
# linha que silenciava o logger saiu daqui de proposito - se o aviso voltar a
# aparecer, e porque algum controller novo voltou a devolver Page direto, e
# esse sinal precisa continuar chegando.

# Limite de tamanho de upload (5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB