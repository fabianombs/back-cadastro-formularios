# .github/workflows/rollback-docker.yml
#
# Rollback pela interface do GitHub (Actions > este workflow > Run workflow),
# para quando nao houver terminal com a chave SSH a mao. (FABIANO-18)
#
# O rollback.yml antigo, que chamava 'sudo /app/rollback.sh' no mundo do JAR
# com systemd, foi APAGADO em 10/08/2026. Ele deixou de funcionar no cutover
# para container (08/08) e continuava aparecendo na lista de Actions com o
# mesmo nome deste — dois botoes iguais numa hora em que ninguem quer escolher.

name: Rollback (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da imagem (SHA curto do commit, ou 'previous')"
        required: true
      com_banco:
        description: "Restaurar TAMBEM o banco? PERDE tudo gravado desde o dump"
        type: boolean
        default: false

jobs:
  rollback:
    name: Rollback na EC2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Executar rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Passada como variavel de ambiente, e nao como argumento, porque o
          # script exige a palavra inteira para restaurar o banco. Marcar uma
          # caixa por engano nao pode ser suficiente para apagar dado de
          # cliente — a intencao precisa aparecer duas vezes.
          CONFIRMA: ${{ inputs.com_banco && 'RESTAURAR' || '' }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CONFIRMA
          script: |
            set -uo pipefail
            cd ~/fabiano/deploy

            # Login no GHCR: a tag alvo pode nao estar na maquina, e ai o
            # script precisa puxa-la do registry.
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            FLAG=""
            if [ "${{ inputs.com_banco }}" = "true" ]; then FLAG="--com-banco"; fi

            export CONFIRMO_PERDA_DE_DADOS="$CONFIRMA"

            # tee para arquivo porque a ssh-action trunca saida acima de ~64 KB,
            # e e justamente no rollback que deu errado que a saida fica grande.
            #
            # No HOME e nao em /var/log: /var/log e 0755 do root, o ec2-user nao
            # cria arquivo la. O tee falharia com 'Permission denied' bem no
            # momento em que o log e a unica coisa que sobra para diagnosticar.
            ./scripts/rollback.sh "${{ inputs.tag }}" $FLAG \
              2>&1 | tee "$HOME/rollback-$(date +%Y%m%d-%H%M%S).log"

            exit "${PIPESTATUS[0]}"

            # Como testar este botao sem mexer em nada:
            #   rode com 'tag' = a tag que JA esta rodando. O rollback.sh
            #   responde "AVISO: ... e a tag que ja esta rodando. Nada a fazer."
            #   e sai 0 — prova o botao, o SSH, o login no GHCR e o caminho do
            #   script, sem trocar a versao no ar.
