# =============================================================================
# terraform plan em PR — o detector de drift (FABIANO-10)
# =============================================================================
# NUNCA aplica. O plan roda, o diff e publicado como comentario no proprio PR, e
# a decisao continua sendo de gente.
#
# Roda tambem de madrugada, todo dia: assim o plan deixa de ser so revisao de
# mudanca e vira vigia de alteracao feita pelo console. Alguem mexeu na AWS a
# mao, o plan da manha seguinte mostra.
name: terraform plan

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-plan.yml'
  schedule:
    # 07:00 UTC = 04:00 em Brasilia, depois da janela de backup do RDS.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write   # necessario para OIDC; sem isto a role nao pode ser assumida

concurrency:
  # Dois plans simultaneos disputam o bloqueio do state e um dos dois falha com
  # uma mensagem que parece problema de credencial.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      # OIDC em vez de chave de acesso: nao existe segredo de longa duracao para
      # vazar, e a credencial dura os minutos do job.
      #
      # PRE-REQUISITO: a role abaixo precisa existir e confiar neste repositorio.
      # Depende da liberacao de IAM que ainda nao saiu — enquanto isso, este
      # workflow falha na autenticacao, e falhar e melhor que rodar com chave
      # estatica commitada.
      - name: Credencial AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TERRAFORM_PLAN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: true

      - name: Formatacao
        run: terraform fmt -check -recursive -diff

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        # -lock-timeout evita falhar de imediato quando outro job segura o
        # bloqueio; -detailed-exitcode distingue "sem mudanca" (0) de "ha
        # mudanca" (2) — e 2 NAO e erro.
        run: |
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m -detailed-exitcode -out=plano.bin
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          terraform show -no-color plano.bin > plano.txt
        continue-on-error: true

      - name: Publicar o diff no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require('fs');
            const bruto = fs.readFileSync('infra/terraform/plano.txt', 'utf8');
            // O comentario do GitHub tem limite de 65536 caracteres.
            const plano = bruto.length > 60000
              ? bruto.slice(0, 60000) + '\n\n... (truncado — ver o log completo do job)'
              : bruto;
            const codigo = process.env.EXITCODE;
            const titulo = codigo === '0'
              ? 'Sem mudancas — a AWS bate com o codigo'
              : codigo === '2'
                ? 'HA MUDANCAS — leia antes de aprovar'
                : 'O plan FALHOU';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### terraform plan — ${titulo}\n\n<details><summary>Ver plano</summary>\n\n\`\`\`terraform\n${plano}\n\`\`\`\n\n</details>`
            });

      # Drift detectado fora de PR (execucao agendada) e sinal de que alguem
      # mexeu pelo console. Falha de proposito, para aparecer.
      - name: Falhar se houve drift na execucao agendada
        if: github.event_name == 'schedule' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "O plan agendado encontrou diferenca entre o codigo e a AWS."
          echo "Ou alguem alterou algo pelo console, ou o codigo ficou para tras."
          exit 1

      - name: Falhar se o plan quebrou
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
