name: Develop Branch - Build, Test & PR to Master

on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptestpassword --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      # O 'cache: maven' do setup-java guarda ~/.m2/repository, mas NAO o
      # Maven em si: o wrapper baixa o apache-maven-*.zip do repositorio
      # central a cada execucao. Uma instabilidade la derruba o build inteiro
      # sem nenhuma relacao com o codigo — aconteceu em 05/08/2026,
      # 'wget: Failed to fetch .../apache-maven-3.9.12-bin.zip'.
      - name: Cache do Maven Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw verify --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: testdb
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-testing

      - name: Verify JAR was generated
        run: ls -la target/*.jar


  # ===========================================================================
  # PACOTE DE DEPLOY NO S3 (FABIANO-58)
  #
  # A esteira entrega os arquivos por scp para uma maquina que JA EXISTE. Uma
  # instancia criada pelo Auto Scaling as 3h da manha nao tem endereco conhecido
  # nem chave autorizada — ninguem faz scp para ela. Ela precisa BUSCAR o
  # pacote, e este job e quem o publica.
  #
  # Nao substitui o scp: enquanto a maquina for fixa, o scp continua sendo o
  # caminho do deploy. Este job so garante que exista um pacote para uma maquina
  # que ainda nao nasceu. Por isso NAO e dependencia do job de deploy — se o
  # bucket estiver fora, o deploy do dia nao pode parar por causa disso.
  # ===========================================================================
  publicar-bundle:
    name: Publicar pacote de deploy (S3)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: credencial temporaria, nenhuma chave guardada

    env:
      AMBIENTE: homologacao
      BUCKET: fabiano-artefatos-135133927228
      # 'secrets' nao pode ser lido no 'if' de um job — o GitHub resolve o if
      # antes de montar o contexto de segredos. Por isso a role passa por env e
      # a decisao de pular fica em cada passo.
      ROLE: ${{ secrets.AWS_ROLE_DEPLOY }}

    steps:
      - uses: actions/checkout@v4

      - name: Montar o pacote
        run: |
          chmod +x infra/montar-bundle.sh
          ./infra/montar-bundle.sh deploy-bundle.tar.gz

      # Anexar a execucao vale mesmo com o S3 no ar: da para baixar e conferir o
      # conteudo de qualquer build passado sem precisar de credencial da AWS.
      - name: Anexar o pacote a execucao
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: deploy-bundle.tar.gz
          retention-days: 14

      - name: Sem credencial da AWS — publicacao pulada
        if: env.ROLE == ''
        run: |
          echo "::notice::AWS_ROLE_DEPLOY nao configurado. O pacote foi montado e anexado a execucao, mas NAO foi para o S3."
          echo "Depende da liberacao de IAM: criar a role OIDC do GitHub Actions e gravar o ARN no segredo AWS_ROLE_DEPLOY."

      - name: Assumir a role de deploy
        if: env.ROLE != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: us-east-1

      - name: Publicar no S3
        if: env.ROLE != ''
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"

          # A copia com SHA e o historico; 'latest' e o que a maquina nova le no
          # boot. A versionada vai PRIMEIRO de proposito: se o job morrer no
          # meio, o latest continua sendo um pacote que ja subiu uma maquina.
          aws s3 cp deploy-bundle.tar.gz "s3://$BUCKET/$AMBIENTE/deploy-bundle-$SHA.tar.gz"
          aws s3 cp deploy-bundle.tar.gz "s3://$BUCKET/$AMBIENTE/deploy-bundle.tar.gz"

          echo "### Pacote publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`s3://$BUCKET/$AMBIENTE/deploy-bundle.tar.gz\` (o que a maquina nova le)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`s3://$BUCKET/$AMBIENTE/deploy-bundle-$SHA.tar.gz\` (historico)" >> "$GITHUB_STEP_SUMMARY"

  # Imagem da branch develop, para o ambiente de homologacao do FABIANO-33.
  # Tag fixa 'develop': homologacao sempre roda o ultimo develop, sem precisar
  # descobrir sha nenhum.
  build-push-develop:
    name: Publicar imagem develop no GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # A tag por SHA e o que o deploy usa. A tag 'develop' e movel: aponta
    # sempre para a ultima, entao nao serve para rollback nem para promover
    # a mesma imagem para producao depois (FABIANO-49).
    outputs:
      tag: ${{ steps.nomes.outputs.tag }}
      owner: ${{ steps.nomes.outputs.owner }}

    steps:
      - uses: actions/checkout@v4

      # O GHCR recusa nome de imagem com maiuscula.
      - name: Normalizar owner e definir a tag
        id: nomes
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:develop
            ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:${{ steps.nomes.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # DEPLOY EM HOMOLOGACAO
  #
  # Enquanto a migracao blue-green nao termina, 'homologacao' e a EC2 nova
  # (FABIANO-13), que depois vira producao. Terminada a virada, o segredo
  # HOMOLOG_EC2_HOST passa a apontar para a instancia clonada (FABIANO-33) e
  # este job continua identico — muda o valor, nao o desenho.
  # ===========================================================================
  deploy-homolog:
    name: Deploy em homologacao
    needs: build-push-develop
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # Os arquivos de deploy (compose, nginx.conf, scripts) vivem no repo, mas
      # NADA os levava ate a maquina: o job so fazia 'cd ~/fabiano/deploy' e
      # rodava o que ja estava la. Uma correcao no nginx.conf entrava no git, o
      # pipeline passava verde, e a maquina continuava com a versao antiga — a
      # divergencia so apareceria no dia em que alguem dependesse dela.
      #
      # SCP a partir do runner, e nao 'git pull' na maquina: evita instalar git
      # e guardar credencial do repositorio dentro de um servidor.
      #
      # O .env NAO e versionado, entao nao ha risco de sobrescrever as
      # credenciais da maquina. O que esta no repo sobrescreve o resto — o repo
      # e a fonte da verdade, e ajuste feito a mao no servidor deve sumir mesmo.
      - uses: actions/checkout@v4

      # Conferir o alvo ANTES de escrever qualquer coisa nele.
      #
      # Esta checagem ja existiu dentro do script de deploy, e estava tarde
      # demais: o scp abaixo ja teria sobrescrito arquivos na maquina errada
      # antes de alguem descobrir que era a maquina errada. Abortar depois de
      # ter mexido em coisa nao e abortar.
      #
      # O .env de ensaio traz '-ensaio.' no DB_HOST. O de producao nao.
      - name: Conferir que o alvo e a maquina certa
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HOMOLOG_EC2_HOST }}
          username: ${{ secrets.HOMOLOG_EC2_USER }}
          key:      ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/fabiano/deploy
            grep -q -- '-ensaio\.' .env || {
              echo "ABORTADO: o .env desta maquina NAO aponta para um banco de ENSAIO."
              echo "Ou o HOMOLOG_EC2_HOST esta errado, ou esta maquina ja virou producao."
              echo "NADA foi enviado."
              exit 1
            }
            echo "Alvo confirmado: banco de ensaio."

      - name: Enviar arquivos de deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.HOMOLOG_EC2_HOST }}
          username: ${{ secrets.HOMOLOG_EC2_USER }}
          key:      ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          # observability/** vai junto: os paineis, as regras de alerta e a
          # config do Loki sao compartilhados com o ambiente de dev e vivem
          # fora de deploy/. Sem esta linha o compose de observabilidade sobe
          # na maquina apontando para arquivo que nao existe.
          source:   "deploy/**,observability/**"
          target:   "/home/ec2-user/fabiano/"
          strip_components: 0
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HOMOLOG_EC2_HOST }}
          username: ${{ secrets.HOMOLOG_EC2_USER }}
          key:      ${{ secrets.HOMOLOG_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/fabiano/deploy

            # O scp nao preserva o bit de execucao.
            chmod +x scripts/*.sh

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Deploy pela tag de SHA, nao pela tag 'develop': e a mesma imagem
            # que sera promovida para producao depois de validada.
            ./scripts/deploy-safe.sh "${{ needs['build-push-develop'].outputs.tag }}"

      - name: Tag validada
        run: |
          echo "Imagem em homologacao: ${{ needs['build-push-develop'].outputs.tag }}"
          echo "E ESTA a tag que deve ir para producao depois de validada."

  create-pr-to-master:
    name: Create PR to Master
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success()
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request to master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_TITLE="release: develop → master"
          PR_BODY="## Release PR\n\nBranch \`develop\` passou em todos os testes e está pronta para produção.\n\n**Merge para master irá disparar deploy automático no Railway.**"

          EXISTING=$(gh pr list --head develop --base master --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING já existe para develop → master. Pulando criação."
          else
            gh pr create \
              --title "$PR_TITLE" \
              --body "$(printf "$PR_BODY")" \
              --base master \
              --head develop
            echo "PR criado com sucesso: develop → master"
          fi
