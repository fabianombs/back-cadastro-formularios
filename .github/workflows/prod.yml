name: Master - Build, Test & Deploy to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptestpassword --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw verify --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: testdb
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-testing

      - name: Verify JAR was generated
        run: ls -la target/*.jar

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  # Publica a imagem no GitHub Container Registry (FABIANO-16).
  #
  # Este job SOMA, nao substitui: o job 'deploy' abaixo continua enviando o JAR
  # por SCP. Trocar agora quebraria o proximo push, porque a EC2 ainda nao tem
  # Docker (FABIANO-13). A troca acontece no FABIANO-17, quando o
  # deploy-safe.sh passar a puxar imagem.
  build-push:
    name: Publicar imagem no GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # O GHCR recusa nome de imagem com maiuscula. Login do GitHub pode ter,
      # e o erro so apareceria no momento do push, depois do build inteiro.
      - name: Normalizar owner e tag curta
        id: nomes
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "curta=${GITHUB_SHA::7}"            >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN e nao PAT: nasce e morre com a execucao, tem escopo so
      # deste repositorio e ninguem precisa rotacionar a mao. O que habilita e
      # o 'packages: write' declarado acima.
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O Dockerfile builda com -DskipTests de proposito: quem garante os
      # testes e o job build-and-test, que este aqui espera via 'needs'.
      # Imagem de codigo reprovado nunca chega a existir.
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:latest
            ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:${{ steps.nomes.outputs.curta }}
            ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo '```'
            echo "ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:latest"
            echo "ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:${{ steps.nomes.outputs.curta }}"
            echo '```'
            echo ""
            echo "Para apontar o deploy a esta versao exata:"
            echo '`BACKEND_TAG=${{ steps.nomes.outputs.curta }}` no .env da EC2"'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to EC2 (safe)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar versao automatica (data + commit)
        id: ver
        run: |
          VER="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Versao deste deploy: $VER"

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: Enviar JAR + scripts via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          source:   "target/*.jar,infra/deploy-safe.sh,infra/rollback.sh,infra/backup-db.sh,infra/enviar-backup-email.py"
          target:   "/home/ec2-user/deploy/"
          strip_components: 0

      - name: Deploy seguro (backup + health-gate + rollback)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo mkdir -p /app

            # Os scripts sao editados no Windows: CRLF quebra o shebang no
            # Linux com o erro enganoso "bad interpreter: /usr/bin/env bash^M".
            sed -i 's/\r$//' /home/ec2-user/deploy/infra/*.sh /home/ec2-user/deploy/infra/*.py

            sudo cp /home/ec2-user/deploy/infra/deploy-safe.sh         /app/deploy-safe.sh
            sudo cp /home/ec2-user/deploy/infra/rollback.sh            /app/rollback.sh
            sudo cp /home/ec2-user/deploy/infra/backup-db.sh           /app/backup-db.sh
            sudo cp /home/ec2-user/deploy/infra/enviar-backup-email.py /app/enviar-backup-email.py
            sudo chmod +x /app/deploy-safe.sh /app/rollback.sh /app/backup-db.sh /app/enviar-backup-email.py

            sudo touch /var/log/backup-db.log
            sudo chown ec2-user /var/log/backup-db.log

            # Cron do backup diario as 03:30 de Brasilia (06:30 UTC).
            # Idempotente: apaga a linha antiga antes de gravar, entao rodar o
            # deploy 50 vezes nao cria 50 entradas no crontab.
            ( sudo crontab -l 2>/dev/null | grep -v 'backup-db.sh' ; \
              echo "30 6 * * * /app/backup-db.sh >> /var/log/backup-db.log 2>&1" ) \
              | sudo crontab -

            JAR=$(ls -t /home/ec2-user/deploy/target/*.jar | head -1)
            sudo /app/deploy-safe.sh "$JAR" "${{ steps.ver.outputs.version }}"
