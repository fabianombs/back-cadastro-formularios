name: Master - Build, Test & Deploy to AWS EC2

on:
  push:
    branches:
      - master
    # Commit que toca SO em script de infra, documentacao ou markdown nao
    # redeploya producao. Deploy sem mudanca de codigo e risco sem contrapartida
    # — e gasta a atencao de quem acompanha em run que nao muda nada.
    #
    # paths-ignore so pula quando TODOS os arquivos alterados casam: commit que
    # mexe em infra/ E em src/ continua deployando normalmente.
    # CORRIGIDO EM 10/08/2026, no mesmo dia em que foi criado: a lista tinha
    # 'infra/**', com o argumento de que infra/ nao chega na producao. Chega.
    # O montar-bundle.sh empacota infra/backup-db.sh no bundle do S3, e a partir
    # de hoje o scp tambem entrega infra/ e instala os scripts em /app.
    #
    # Ignorar infra/ inteiro faria uma correcao no backup-db.sh nunca ser
    # deployada — que e exatamente o defeito que este commit conserta.
    #
    # Sobra o que de fato nunca roda numa maquina: script de PowerShell, que so
    # existe para a estacao de trabalho.
    paths-ignore:
      - 'infra/**.ps1'
      - 'docs/**'
      - '**.md'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptestpassword --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      # O 'cache: maven' do setup-java guarda ~/.m2/repository, mas NAO o
      # Maven em si: o wrapper baixa o apache-maven-*.zip do repositorio
      # central a cada execucao. Uma instabilidade la derruba o build inteiro
      # sem nenhuma relacao com o codigo — aconteceu em 05/08/2026,
      # 'wget: Failed to fetch .../apache-maven-3.9.12-bin.zip'.
      - name: Cache do Maven Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and run tests
        run: ./mvnw verify --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: testdb
          DB_USER: root
          DB_PASSWORD: testpassword
          JWT_SECRET: ci-test-secret-key-that-is-long-enough-for-testing

      - name: Verify JAR was generated
        run: ls -la target/*.jar


  # ===========================================================================
  # PACOTE DE DEPLOY NO S3 (FABIANO-58)
  #
  # A esteira entrega os arquivos por scp para uma maquina que JA EXISTE. Uma
  # instancia criada pelo Auto Scaling as 3h da manha nao tem endereco conhecido
  # nem chave autorizada — ninguem faz scp para ela. Ela precisa BUSCAR o
  # pacote, e este job e quem o publica.
  #
  # Nao substitui o scp: enquanto a maquina for fixa, o scp continua sendo o
  # caminho do deploy. Este job so garante que exista um pacote para uma maquina
  # que ainda nao nasceu. Por isso NAO e dependencia do job de deploy — se o
  # bucket estiver fora, o deploy do dia nao pode parar por causa disso.
  # ===========================================================================
  publicar-bundle:
    name: Publicar pacote de deploy (S3)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: credencial temporaria, nenhuma chave guardada

    env:
      AMBIENTE: producao
      BUCKET: fabiano-artefatos-135133927228
      # 'secrets' nao pode ser lido no 'if' de um job — o GitHub resolve o if
      # antes de montar o contexto de segredos. Por isso a role passa por env e
      # a decisao de pular fica em cada passo.
      ROLE: ${{ secrets.AWS_ROLE_DEPLOY }}

    steps:
      - uses: actions/checkout@v4

      - name: Montar o pacote
        run: |
          chmod +x infra/montar-bundle.sh
          ./infra/montar-bundle.sh deploy-bundle.tar.gz

      # Anexar a execucao vale mesmo com o S3 no ar: da para baixar e conferir o
      # conteudo de qualquer build passado sem precisar de credencial da AWS.
      - name: Anexar o pacote a execucao
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle-${{ github.sha }}
          path: deploy-bundle.tar.gz
          retention-days: 14

      - name: Sem credencial da AWS — publicacao pulada
        if: env.ROLE == ''
        run: |
          echo "::notice::AWS_ROLE_DEPLOY nao configurado. O pacote foi montado e anexado a execucao, mas NAO foi para o S3."
          echo "Depende da liberacao de IAM: criar a role OIDC do GitHub Actions e gravar o ARN no segredo AWS_ROLE_DEPLOY."

      - name: Assumir a role de deploy
        if: env.ROLE != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: us-east-1

      - name: Publicar no S3
        if: env.ROLE != ''
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"

          # A copia com SHA e o historico; 'latest' e o que a maquina nova le no
          # boot. A versionada vai PRIMEIRO de proposito: se o job morrer no
          # meio, o latest continua sendo um pacote que ja subiu uma maquina.
          aws s3 cp deploy-bundle.tar.gz "s3://$BUCKET/$AMBIENTE/deploy-bundle-$SHA.tar.gz"
          aws s3 cp deploy-bundle.tar.gz "s3://$BUCKET/$AMBIENTE/deploy-bundle.tar.gz"

          echo "### Pacote publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`s3://$BUCKET/$AMBIENTE/deploy-bundle.tar.gz\` (o que a maquina nova le)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`s3://$BUCKET/$AMBIENTE/deploy-bundle-$SHA.tar.gz\` (historico)" >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # A IMAGEM DE PRODUCAO (FABIANO-49)
  #
  # Este job PROMOVE a imagem que ja foi validada em homologacao, em vez de
  # construir uma nova a partir da master.
  #
  # A diferenca importa. Reconstruir produz um artefato que NUNCA foi testado:
  # mesmo codigo-fonte, outra imagem, outro instante, outras camadas base
  # resolvidas. "Subir para producao o que foi validado" viraria "rebuildar e
  # torcer" - e a validacao inteira do FABIANO-15 perderia o sentido.
  #
  # O merge de develop em master gera um commit de merge cujo SEGUNDO pai e a
  # ponta da develop, que e exatamente o commit cuja imagem rodou em
  # homologacao. Em merge fast-forward nao existe segundo pai, e o proprio HEAD
  # ja e esse commit.
  # ===========================================================================
  imagem:
    name: Promover imagem validada
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.saida.outputs.tag }}
      owner: ${{ steps.nomes.outputs.owner }}
      promovida: ${{ steps.alvo.outputs.promovida }}

    steps:
      # fetch-depth 0 porque o padrao traz um clone raso, e num clone raso o
      # segundo pai do commit de merge simplesmente nao existe - a deteccao
      # falharia sempre, silenciosamente, caindo no rebuild toda vez.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O GHCR recusa nome de imagem com maiuscula, e o erro so apareceria no
      # push, depois do build inteiro.
      - name: Normalizar owner
        id: nomes
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN e nao PAT: nasce e morre com a execucao, tem escopo so
      # deste repositorio e ninguem precisa rotacionar a mao.
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descobrir qual imagem foi validada
        id: alvo
        run: |
          set -uo pipefail
          IMAGEM="ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back"

          if PAI2=$(git rev-parse --verify -q HEAD^2); then
            CAND="${PAI2::7}"
            echo "Commit de merge: a develop entrou pelo segundo pai ($CAND)."
          else
            CAND="${GITHUB_SHA::7}"
            echo "Sem segundo pai (fast-forward ou commit direto na master)."
          fi
          echo "candidata=$CAND" >> "$GITHUB_OUTPUT"

          # imagetools inspect le o manifesto no registry sem baixar a imagem.
          if docker buildx imagetools inspect "$IMAGEM:$CAND" >/dev/null 2>&1; then
            echo "promovida=true" >> "$GITHUB_OUTPUT"
            echo "ACHEI $IMAGEM:$CAND - esta imagem ja passou por homologacao."
          else
            echo "promovida=false" >> "$GITHUB_OUTPUT"
            echo "NAO existe $IMAGEM:$CAND no GHCR."
          fi

      # Copia de manifesto, nao rebuild: os bytes da imagem sao exatamente os
      # mesmos que rodaram em homologacao.
      - name: Promover
        if: steps.alvo.outputs.promovida == 'true'
        run: |
          IMAGEM="ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back"
          CAND="${{ steps.alvo.outputs.candidata }}"
          docker buildx imagetools create \
            -t "$IMAGEM:latest" \
            -t "$IMAGEM:prod-$CAND" \
            "$IMAGEM:$CAND"
          echo "$IMAGEM:$CAND promovida para :latest e :prod-$CAND"

      # Caminho de excecao: hotfix direto na master, ou merge cuja imagem de
      # develop expirou. Nao bloqueia o deploy - bloquear um hotfix urgente e
      # pior - mas NUNCA pode parecer igual a uma promocao. Ver o resumo.
      - name: Construir (imagem validada nao encontrada)
        if: steps.alvo.outputs.promovida != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:latest
            ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:${{ github.sha }}
            ghcr.io/${{ steps.nomes.outputs.owner }}/fabiano-back:prod-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Definir a tag do deploy
        id: saida
        run: |
          if [ "${{ steps.alvo.outputs.promovida }}" = "true" ]; then
            echo "tag=${{ steps.alvo.outputs.candidata }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resumo
        run: |
          {
            if [ "${{ steps.alvo.outputs.promovida }}" = "true" ]; then
              echo "### Imagem PROMOVIDA de homologacao"
              echo ""
              echo "Tag \`${{ steps.alvo.outputs.candidata }}\` - os mesmos bytes que rodaram em homologacao."
            else
              echo "### ATENCAO: imagem construida agora, NAO promovida"
              echo ""
              echo "Nao existe imagem publicada para \`${{ steps.alvo.outputs.candidata }}\`."
              echo "A imagem que vai para producao foi construida nesta execucao e"
              echo "**nunca passou por homologacao**."
              echo ""
              echo "Isso e esperado num hotfix direto na master. Em qualquer outro"
              echo "caso, investigue antes de confiar neste deploy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # DEPLOY EM PRODUCAO
  #
  # Sem SCP de JAR: a imagem vem do registry. O que trafega por SSH e um
  # comando, nao um artefato.
  #
  # A instalacao da cron de backup saiu daqui de proposito. Ela e coisa de
  # provisionamento (FABIANO-47), feita uma vez - nao algo reinstalado a cada
  # deploy da aplicacao.
  # ===========================================================================
  deploy:
    name: Deploy em producao
    needs: [build-and-test, imagem]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # Os arquivos de deploy (compose, nginx.conf, scripts) vivem no repo, mas
      # NADA os levava ate a maquina: o job so fazia 'cd ~/fabiano/deploy' e
      # rodava o que ja estava la. Uma correcao no nginx.conf entrava no git, o
      # pipeline passava verde, e a maquina continuava com a versao antiga — a
      # divergencia so apareceria no dia em que alguem dependesse dela.
      #
      # SCP a partir do runner, e nao 'git pull' na maquina: evita instalar git
      # e guardar credencial do repositorio dentro de um servidor.
      #
      # O .env NAO e versionado, entao nao ha risco de sobrescrever as
      # credenciais da maquina. O que esta no repo sobrescreve o resto — o repo
      # e a fonte da verdade, e ajuste feito a mao no servidor deve sumir mesmo.
      - uses: actions/checkout@v4

      # Conferir o alvo ANTES de escrever qualquer coisa nele.
      #
      # Esta checagem ja existiu dentro do script de deploy, e estava tarde
      # demais: o scp abaixo ja teria sobrescrito arquivos na maquina errada
      # antes de alguem descobrir que era a maquina errada. Abortar depois de
      # ter mexido em coisa nao e abortar.
      #
      # O .env de ensaio traz '-ensaio.' no DB_HOST. O de producao nao.
      - name: Conferir que o alvo e a maquina certa
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/fabiano/deploy
            # Espelho da trava do develop.yml: la aborta se FOR producao,
            # aqui aborta se NAO for. As duas juntas fecham o cerco.
            #
            # Reescrita em 08/08/2026 pelo mesmo motivo (ver develop.yml): a
            # versao anterior procurava '-ensaio.', o nome de um banco
            # temporario. Passou a exigir o nome de producao, que e o unico que
            # nao muda.
            if ! grep -qE '^DB_HOST=.*poc-fabiano-db\.' .env; then
              echo "ABORTADO: o .env desta maquina NAO aponta para o banco de PRODUCAO."
              echo "Este job e o de PRODUCAO. Confira o segredo EC2_HOST."
              echo "NADA foi enviado."
              exit 1
            fi
            echo "Alvo confirmado: banco de producao."

      - name: Enviar arquivos de deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          # observability/** vai junto pelo mesmo motivo do develop.yml: os
          # paineis, as regras de alerta e a config do Loki vivem fora de
          # deploy/. Na virada (FABIANO-47) esta maquina passa a rodar a stack
          # de observabilidade, e sem isto o compose subiria apontando para
          # arquivo que nao existe.
          # infra/** entrou em 10/08/2026. Os scripts que rodam NA maquina
          # (/app/backup-db.sh e /app/renovar-certificados.sh) moram em infra/ e
          # ate entao so chegavam aqui por instalacao manual.
          source:   "deploy/**,observability/**,infra/**"
          target:   "/home/ec2-user/fabiano/"
          strip_components: 0
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/fabiano/deploy

            # O scp nao preserva o bit de execucao.
            chmod +x scripts/*.sh

            # Nao renderiza nada em producao: CONFERE. O arquivo do repositorio
            # vai para a maquina como esta, e esta trava existe porque entre 08 e
            # 10/08/2026 ele passou tres dias declarando 'ambiente: homolog' —
            # resto da virada, e ninguem viu. O script aborta ANTES de qualquer
            # escrita, entao o modo de falha e seguro.
            ./scripts/render-observabilidade.sh prod

            # Instalar os scripts de infra que RODAM nesta maquina.
            #
            # Ate 10/08/2026 isso era manual, e o resultado foi medido nesse
            # dia: a producao rodava um backup-db.sh SEM a correcao de fuso do
            # log, que estava no repositorio havia dias. O log carimbava UTC e o
            # nome do arquivo, horario de Brasilia — tres horas de diferenca na
            # mesma linha. Custou meia hora tratando como possivel defeito uma
            # correcao que ja existia e nunca tinha sido entregue.
            #
            # Compara antes de instalar so para o log dizer o que mudou. O
            # 'install' seria idempotente de qualquer jeito; o que nao seria e
            # saber, olhando a execucao, se algo mudou ou nao.
            for f in backup-db.sh renovar-certificados.sh enviar-backup-email.py; do
              ORIG="$HOME/fabiano/infra/$f"
              [ -f "$ORIG" ] || { echo "::warning::$f nao veio no pacote"; continue; }
              if sudo diff -q "$ORIG" "/app/$f" >/dev/null 2>&1; then
                echo "  $f ja identico"
              else
                sudo install -m 755 -o root -g root "$ORIG" "/app/$f"
                echo "  $f ATUALIZADO em /app"
              fi
            done

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            ./scripts/deploy-safe.sh "${{ needs.imagem.outputs.tag }}"

      # A stack de observabilidade le configuracao no BOOT: o Grafana carrega
      # provisioning/ ao subir, e Prometheus, Loki e Promtail leem os proprios
      # arquivos ao subir. O scp acima entrega painel e regra novos, mas sem
      # recriar o container eles ficam no disco SEM EFEITO NENHUM — e o
      # pipeline verde afirma que estao no ar (FABIANO-63).
      #
      # O caso mais perigoso e o do alerta: a unica forma de perceber que ele
      # nao foi aplicado seria um incidente em que ele deveria tocar e nao toca.
      #
      # Passo separado, DEPOIS do deploy, e que NUNCA derruba a execucao.
      # Observabilidade fora do ar e ruim; derrubar o deploy da aplicacao por
      # causa dela e pior. A falha vira aviso visivel, nao silencio.
      - name: Recarregar a observabilidade e o nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/fabiano/deploy || {
              echo "::warning::Nao achei ~/fabiano/deploy nesta maquina. Observabilidade nao recarregada."
              exit 0
            }

            # 'up -d' recria SOMENTE os servicos cuja definicao ou configuracao
            # mudou; os demais continuam de pe. Nao e restart cego da stack.
            #
            # Roda depois do deploy-safe.sh de proposito: o compose de
            # observabilidade usa a rede externa 'fabiano-internal', criada pelo
            # compose da aplicacao. Antes dele, a rede nao existe.
            if docker compose -f docker-compose.observability.yml up -d; then
              echo "observabilidade recarregada"
              docker compose -f docker-compose.observability.yml ps
            else
              echo "::warning::A stack de observabilidade NAO subiu. Painel e alerta continuam com a versao ANTERIOR, mesmo com este deploy verde. Causa mais comum: variaveis SMTP_HOST/SMTP_USER/SMTP_PASS ausentes no .env da maquina — elas sao obrigatorias no compose e travam o arquivo inteiro (ver FABIANO-28)."
            fi

            # ---- FABIANO-68 -------------------------------------------------
            # 'up -d' compara a DEFINICAO do servico, nao o conteudo dos
            # arquivos montados por bind. Prometheus, Loki e Promtail leem a
            # propria configuracao no BOOT: alterar prometheus.yml,
            # promtail-config.yml ou loki-config.yml NAO muda a definicao do
            # servico, entao o Compose nao recria nada e o processo continua
            # rodando com a versao anterior.
            #
            # Aconteceu em 07/08/2026: o job do blackbox entrou no
            # prometheus.yml, o deploy passou verde, e o container seguiu 47h
            # com a config antiga. Como as regras novas usam
            # noDataState: Alerting, o resultado foi alarme falso por e-mail.
            #
            # Restart incondicional, e nao recarga condicional, de proposito:
            # custa ~10 segundos e nao tem como errar. Este projeto ja foi
            # mordido quatro vezes pelo mesmo padrao — mecanismo esperto que
            # falha calado (FABIANO-29, 62, 63 e este).
            #
            # O GRAFANA entrou nesta lista em 08/08/2026, e a ausencia dele era
            # a versao mais cara do mesmo bug: o Grafana le provisioning/ —
            # datasources, paineis e REGRAS DE ALERTA — apenas no boot. Alterar
            # rules.yaml no repositorio passava verde no deploy e o alerta
            # continuava com a versao anterior, indefinidamente.
            #
            # A unica forma de perceber seria um incidente em que o alerta novo
            # deveria tocar e nao toca — ou seja, descobrir pelo pior caminho
            # possivel, que e exatamente o que esta epica existe para evitar.
            #
            # Recriar o Grafana troca o IP do container: por isso o reload do
            # nginx logo abaixo (FABIANO-67) nao e opcional, e vem DEPOIS.
            if docker compose -f docker-compose.observability.yml restart prometheus loki promtail grafana; then
              echo "prometheus, loki, promtail e grafana releram a configuracao"
            else
              echo "::warning::Nao consegui reiniciar prometheus/loki/promtail/grafana. A configuracao nova esta no DISCO da maquina, mas os processos continuam com a ANTERIOR — este deploy verde nao aplicou o que voce mudou. Conserto manual: docker compose -f docker-compose.observability.yml restart prometheus loki promtail grafana (FABIANO-68)."
            fi

            # ---- FABIANO-67 -------------------------------------------------
            # O nginx resolve os nomes de 'proxy_pass' (backend, grafana) uma
            # UNICA vez, quando carrega a configuracao. Todo container recriado
            # nos passos acima ganhou IP novo na rede do Docker, e o nginx
            # continuaria falando com o IP de antes — devolvendo 502 para
            # sempre, com o container Up (healthy) e nenhum sinal interno
            # acusando. Foi o que derrubou o grafana-hml em 07/08/2026.
            #
            # 'reload' e graceful: sobe workers novos e drena os antigos, sem
            # derrubar conexao em andamento. Roda por ultimo, depois de tudo
            # que podia ter sido recriado.
            if docker exec fabiano-nginx nginx -s reload; then
              echo "nginx recarregado — enderecos dos containers re-resolvidos"
            else
              echo "::warning::Nao consegui recarregar o nginx. Se algum container foi recriado neste deploy, o dominio dele pode estar respondendo 502 agora, mesmo com o container saudavel. Conferir de fora com curl e, se preciso: docker exec fabiano-nginx nginx -s reload (FABIANO-67)."
            fi

            # Nunca propaga falha: ver o comentario do passo.
            exit 0

      - name: Resumo do deploy
        run: |
          {
            echo "### Producao"
            echo ""
            echo "Tag no ar: \`${{ needs.imagem.outputs.tag }}\`"
            echo "Promovida de homologacao: \`${{ needs.imagem.outputs.promovida }}\`"
            echo ""
            echo "Para voltar, na EC2: \`./scripts/rollback.sh <tag>\`"
          } >> "$GITHUB_STEP_SUMMARY"
