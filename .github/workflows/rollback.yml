# .github/workflows/rollback.yml
# Rollback manual pela interface do GitHub Actions (Actions > Rollback > Run workflow).
# Voce informa a versao; opcionalmente restaura o banco (emergencia, perde dados novos).
name: Rollback (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao para voltar (ex: 1.0.0)"
        required: true
      with_db:
        description: "Restaurar tambem o banco? (PERDE dados novos)"
        type: boolean
        default: false

jobs:
  rollback:
    name: Rollback no EC2
    runs-on: ubuntu-latest
    steps:
      - name: Executar rollback via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            FLAG=""
            if [ "${{ inputs.with_db }}" = "true" ]; then FLAG="--with-db"; fi
            sudo /app/rollback.sh "${{ inputs.version }}" $FLAG
